openapi: 3.0.3
info:
  title: Theatre API
  version: 1.0.0
  description: API for managing theatre performances and ticket reservations.
paths:
  /api/actors/:
    get:
      operationId: actors_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - actors
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActorList'
          description: ''
    post:
      operationId: actors_create
      tags:
      - actors
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Actor'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Actor'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Actor'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actor'
          description: ''
  /api/actors/{id}/:
    get:
      operationId: actors_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this actor.
        required: true
      tags:
      - actors
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actor'
          description: ''
    put:
      operationId: actors_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this actor.
        required: true
      tags:
      - actors
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Actor'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Actor'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Actor'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actor'
          description: ''
    patch:
      operationId: actors_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this actor.
        required: true
      tags:
      - actors
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedActor'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedActor'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedActor'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actor'
          description: ''
    delete:
      operationId: actors_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this actor.
        required: true
      tags:
      - actors
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
